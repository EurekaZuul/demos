    return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt'])
      .then(function (k) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, k, b64(P.data)); })
      .then(function (buf) {
        var html = new TextDecoder().decode(buf);
        document.open(); document.write(html); document.close();
      });
  }
  function derive(pw) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits'])
      .then(function (k) { return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256' }, k, 256); })
      .then(function (bits) { return new Uint8Array(bits); });
  }
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) {}
  if (saved && saved.salt === P.salt) {
    open(b64(saved.key)).catch(function () { localStorage.removeItem(STORE); });
  }
  var f = document.getElementById('f'), go = document.getElementById('go'), err = document.getElementById('err');
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = document.getElementById('pw').value;
    if (!pw) return;
    go.disabled = true; go.textContent = '验证中…'; err.textContent = '';
    derive(pw).then(function (raw) {
      // 解密成功后页面会被替换，所以先读取「记住」勾选状态
      var remember = document.getElementById('remember').checked;
      return open(raw).then(function () {
        try { if (remember) localStorage.setItem(STORE, JSON.stringify({ salt: P.salt, key: enc(raw) })); } catch (e) {}
      });
    }).catch(function () {
      go.disabled = false; go.textContent = '进入'; err.textContent = '密码不正确';
    });
  });
})();
</script>
</body>
</html>
