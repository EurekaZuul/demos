const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256'},
                                           base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(P.iv)}, key, b64(P.ct));
  const html = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open(); document.write(html); document.close();
}
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const pw = document.getElementById('pw').value, btn = document.getElementById('btn'), err = document.getElementById('err');
  btn.disabled = true; btn.textContent = '解密中…'; err.textContent = '';
  try { await unlock(pw); sessionStorage.setItem('pw', pw); }
  catch (x) { err.textContent = '密码不正确'; btn.disabled = false; btn.textContent = '查看'; }
};
const saved = sessionStorage.getItem('pw');
if (saved) unlock(saved).catch(() => sessionStorage.removeItem('pw'));
